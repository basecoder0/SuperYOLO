# M3FD Dataset - Multispectral Fusion Detection Dataset
# Visible-Infrared image pairs for object detection
# Train command: python train.py --data SRm3fd.yaml

# train and val data as file paths
train: dataset/M3FD/fold01_write.txt
test: dataset/M3FD/fold01test_write.txt
